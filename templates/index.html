<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #212121;
            --sidebar-color: #171717;
            --chat-bg: #212121;
            --bubble-user: #2f2f2f;
            --border-color: #2f2f2f;
            --text-main: #ececec;
            --text-muted: #b4b4b4;
            --accent: #10a37f;
            --accent-hover: #1a7f64;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            background: transparent;
            border: 1px solid #3e3e3e;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #2a2a2a;
        }

        .sidebar-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 13px;
        }

        .settings-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .option-box {
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-item label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d1d5db;
        }

        .toggle-item input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
            width: 15px;
            height: 15px;
        }

        .text-input-clean {
            width: 100%;
            background: #141414;
            border: 1px solid #333;
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .text-input-clean:focus {
            border-color: #555;
        }

        .filter-summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--text-muted);
            user-select: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-summary:hover {
            color: var(--text-main);
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
        }

        .top-bar {
            height: 52px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .empty-greeting {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
            gap: 16px;
            margin: auto 0;
        }

        .empty-greeting h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 600px;
        }

        .chip {
            background: #2f2f2f;
            border: 1px solid #3e3e3e;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 9999px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            background: #3e3e3e;
        }

        .message-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
            background: #343541;
            color: #ececec;
        }

        .msg-avatar.ai {
            background: var(--accent);
            color: white;
        }

        .msg-body {
            max-width: 75%;
            line-height: 1.6;
            font-size: 14.5px;
            color: #ececec;
            word-break: break-word;
        }

        .message-row.user .msg-body {
            background: var(--bubble-user);
            padding: 10px 16px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
        }

        .message-row.bot .msg-body {
            padding: 2px 0;
        }

        .msg-body img {
            max-width: 260px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        .trace-card {
            background: #171717;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            overflow: hidden;
        }

        .trace-toggle {
            padding: 8px 12px;
            background: #1e1e1e;
            color: #9ca3af;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .trace-toggle:hover {
            color: #d1d5db;
        }

        .trace-content {
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #262626;
        }

        .trace-item {
            display: flex;
            gap: 8px;
            line-height: 1.4;
            color: #d1d5db;
        }

        .trace-step-tag {
            color: #9ca3af;
            font-weight: 600;
            flex-shrink: 0;
        }

        .approval-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-yes {
            background: var(--accent);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-no {
            background: #dc2626;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
        }

        .composer-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 24px 20px;
        }

        .composer-box {
            background: #2f2f2f;
            border-radius: 24px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #3e3e3e;
            transition: border-color 0.2s;
        }

        .composer-box:focus-within {
            border-color: #555;
        }

        .attach-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .attach-btn:hover {
            color: var(--text-main);
        }

        .composer-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14.5px;
            padding: 4px 0;
        }

        .composer-input::placeholder {
            color: #8e8e8e;
        }

        .send-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .send-icon-btn:hover {
            opacity: 0.85;
        }

        .preview-tag {
            display: none;
            font-size: 11px;
            background: #1f1f1f;
            padding: 2px 8px;
            border-radius: 4px;
            color: #d1d5db;
            margin-bottom: 6px;
            width: fit-content;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="clearChat()">
                <span>＋</span> New conversation
            </button>
        </div>

        <div class="sidebar-body">
            <div>
                <div class="settings-label">Settings</div>

                <div class="option-box">

                    <div class="toggle-item">
                        <label>
                            <input type="checkbox" id="mcp-toggle" checked>
                            MCP Tools & Trace
                        </label>
                    </div>

                    <div class="toggle-item">
                        <label>
                            <input type="checkbox" id="rag-toggle">
                            RAG Knowledge Search
                        </label>
                    </div>

                    <div style="margin-top: 4px;">
                        <span style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">
                            API Key
                        </span>

                        <input
                            type="password"
                            id="api-key"
                            class="text-input-clean"
                            value="anmol123"
                            placeholder="API Key"
                        >
                    </div>

                    <div>
                        <span style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">
                            Temperature:
                            <span id="temp-val">0.7</span>
                        </span>

                        <input
                            type="range"
                            id="temp-slider"
                            min="0"
                            max="1.5"
                            step="0.1"
                            value="0.7"
                            style="width: 100%; accent-color: var(--accent);"
                            oninput="document.getElementById('temp-val').textContent = this.value"
                        >
                    </div>

                </div>
            </div>

            <details style="font-size: 12px; color: var(--text-muted);">
                <summary class="filter-summary">Advanced Filters</summary>

                <div class="option-box" style="margin-top: 8px;">

                    <div>
                        <span style="font-size: 11px; color: var(--text-muted);">
                            Category
                        </span>

                        <select
                            id="filter-category"
                            class="text-input-clean"
                            style="margin-top: 4px;"
                        >
                            <option value="all">All Categories</option>
                            <option value="work_experience">Work Experience</option>
                            <option value="skills">Technical Skills</option>
                            <option value="education">Education</option>
                            <option value="summary">Summary</option>
                        </select>
                    </div>

                    <input type="hidden" id="filter-role" value="all">
                    <input type="hidden" id="filter-rule" value="must">

                </div>
            </details>
        </div>
    </aside>

    <main class="chat-main">

        <header class="top-bar">
            <span>Gemini Chat</span>

            <div class="top-status">
                <div class="status-dot"></div>
                <span>Ready</span>
            </div>
        </header>

        <div class="messages-area" id="chat-box">

            <div class="empty-greeting" id="empty-greeting">

                <h2>What's on your mind?</h2>

                <div class="quick-chips">

                    <div
                        class="chip"
                        onclick="quickAsk('What is 15 multiplied by 20?')"
                    >
                        Calculate 15 × 20
                    </div>

                    <div
                        class="chip"
                        onclick="quickAsk('Delete report.pdf')"
                    >
                        Test tool approval
                    </div>

                    <div
                        class="chip"
                        onclick="quickAsk('What are your technical skills?')"
                    >
                        Skills inquiry
                    </div>

                </div>
            </div>

        </div>

        <div class="composer-container">

            <div class="preview-tag" id="preview-badge">
                <span id="preview-filename">image.png</span>

                <span
                    style="cursor: pointer; margin-left: 6px; color: #f87171;"
                    onclick="removeImage()"
                >
                    ✕
                </span>
            </div>

            <div class="composer-box">

                <label
                    for="image-input"
                    class="attach-btn"
                    title="Upload image"
                >
                    📎
                </label>

                <input
                    type="file"
                    id="image-input"
                    accept="image/*"
                    style="display: none;"
                >

                <input
                    type="text"
                    id="user-input"
                    class="composer-input"
                    placeholder="Message..."
                    autocomplete="off"
                >

                <button
                    class="send-icon-btn"
                    id="send-btn"
                    title="Send message"
                >
                    ↑
                </button>

            </div>
        </div>

    </main>

    <script>

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');
        const imageInput = document.getElementById('image-input');
        const previewBadge = document.getElementById('preview-badge');
        const previewFilename = document.getElementById('preview-filename');
        const emptyGreeting = document.getElementById('empty-greeting');

        let chatHistory = [];

        imageInput.onchange = function () {

            const file = imageInput.files[0];

            if (file) {
                previewFilename.textContent = file.name;
                previewBadge.style.display = 'block';
            }
        };

        function removeImage() {

            imageInput.value = '';
            previewBadge.style.display = 'none';

        }

        function quickAsk(text) {

            userInput.value = text;
            sendMessage();

        }

        function clearChat() {

            chatBox.innerHTML = '';
            chatHistory = [];

            if (emptyGreeting) {
                chatBox.appendChild(emptyGreeting);
                emptyGreeting.style.display = 'flex';
            }

        }

        function addMessage(sender, text, imgUrl) {

            if (emptyGreeting) {
                emptyGreeting.style.display = 'none';
            }

            const row = document.createElement('div');

            row.className = `message-row ${sender}`;

            const avatar = document.createElement('div');

            avatar.className =
                `msg-avatar ${sender === 'user' ? 'user' : 'ai'}`;

            avatar.textContent =
                sender === 'user' ? 'U' : '✦';

            const body = document.createElement('div');

            body.className = 'msg-body';

            if (imgUrl) {

                const img = document.createElement('img');

                img.src = imgUrl;

                body.appendChild(img);
            }

            const textNode = document.createElement('div');

            textNode.textContent = text;

            body.appendChild(textNode);

            if (sender === 'user') {

                row.appendChild(body);

            } else {

                row.appendChild(avatar);
                row.appendChild(body);

            }

            chatBox.appendChild(row);

            chatBox.scrollTop = chatBox.scrollHeight;

            return body;
        }

        function renderTrace(traceSteps, parentEl) {

            if (!traceSteps || traceSteps.length === 0) {
                return;
            }

            const card = document.createElement('div');

            card.className = 'trace-card';

            const toggle = document.createElement('div');

            toggle.className = 'trace-toggle';

            toggle.innerHTML =
                `<span>Tool execution log (${traceSteps.length} steps)</span>
                 <span>▾</span>`;

            const content = document.createElement('div');

            content.className = 'trace-content';

            toggle.onclick = function () {

                const isHidden =
                    content.style.display === 'none';

                content.style.display =
                    isHidden ? 'flex' : 'none';

                toggle.querySelector('span:last-child').textContent =
                    isHidden ? '▾' : '▸';
            };

            const pendingRefs = {};

            traceSteps.forEach(step => {

                const item = document.createElement('div');

                item.className = 'trace-item';

                const tag = document.createElement('div');

                tag.className = 'trace-step-tag';

                tag.textContent = `${step.step}.`;

                const text = document.createElement('div');

                text.style.flex = "1";

                if (
                    step.type === 'approval_required' &&
                    step.content !== 'pending'
                ) {

                    text.innerHTML =
                        `<div><strong>Approval needed:</strong> ${step.content}</div>`;

                    const actions = document.createElement('div');

                    actions.className = 'approval-actions';

                    const approveBtn =
                        document.createElement('button');

                    approveBtn.className = 'btn-yes';

                    approveBtn.textContent = 'Approve';

                    const denyBtn =
                        document.createElement('button');

                    denyBtn.className = 'btn-no';

                    denyBtn.textContent = 'Deny';

                    approveBtn.onclick = function () {

                        actions.remove();

                        if (pendingRefs[step.tool_name]) {

                            pendingRefs[step.tool_name]
                                .decision.textContent =
                                'Approved by user';

                            pendingRefs[step.tool_name]
                                .decision.style.color =
                                '#34d399';
                        }
                    };

                    denyBtn.onclick = function () {

                        actions.remove();

                        if (pendingRefs[step.tool_name]) {

                            pendingRefs[step.tool_name]
                                .decision.textContent =
                                'Denied by user';

                            pendingRefs[step.tool_name]
                                .decision.style.color =
                                '#f87171';
                        }
                    };

                    actions.appendChild(approveBtn);
                    actions.appendChild(denyBtn);

                    text.appendChild(actions);

                } else if (
                    step.type === 'user_decision' &&
                    step.content === 'pending'
                ) {

                    text.textContent =
                        'Awaiting decision...';

                    text.style.color =
                        '#9ca3af';

                    if (!pendingRefs[step.tool_name]) {
                        pendingRefs[step.tool_name] = {};
                    }

                    pendingRefs[step.tool_name].decision =
                        text;

                } else {

                    text.textContent =
                        `${step.label}: ${step.content}`;
                }

                item.appendChild(tag);
                item.appendChild(text);

                content.appendChild(item);

            });

            card.appendChild(toggle);
            card.appendChild(content);

            parentEl.appendChild(card);

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }

        async function sendMessage() {

            const text =
                userInput.value.trim();

            const key =
                apiKeyInput.value.trim();

            const temp =
                parseFloat(
                    document.getElementById('temp-slider').value
                );

            const file =
                imageInput.files[0];

            if (text === "" && !file) {
                return;
            }

            const currentText = text;

            userInput.value = '';

            let userBody = null;

            if (file) {

                const reader =
                    new FileReader();

                reader.onload =
                    async function () {

                        const base64Image =
                            reader.result.split(',')[1];

                        const imageType =
                            file.type;

                        const localUrl =
                            URL.createObjectURL(file);

                        userBody =
                            addMessage(
                                'user',
                                currentText,
                                localUrl
                            );

                        chatHistory.push({
                            role: 'user',
                            text: currentText || "[Image]"
                        });

                        removeImage();

                        await sendRequest(
                            currentText,
                            key,
                            temp,
                            base64Image,
                            imageType,
                            userBody
                        );
                    };

                reader.readAsDataURL(file);

            } else {

                userBody =
                    addMessage(
                        'user',
                        currentText
                    );

                chatHistory.push({
                    role: 'user',
                    text: currentText
                });

                await sendRequest(
                    currentText,
                    key,
                    temp,
                    null,
                    null,
                    userBody
                );
            }
        }

        async function sendRequest(
            text,
            key,
            temp,
            base64,
            imgType,
            userBody
        ) {

            try {

                const useRag =
                    document.getElementById(
                        'rag-toggle'
                    ).checked;

                const useMCP =
                    document.getElementById(
                        'mcp-toggle'
                    ).checked;

                const filterCategory =
                    document.getElementById(
                        'filter-category'
                    ).value;

                const loadRow =
                    document.createElement('div');

                loadRow.className =
                    'message-row bot';

                loadRow.id =
                    'loading';

                loadRow.innerHTML =
                    `<div class="msg-avatar ai">✦</div>
                     <div class="msg-body"
                          style="color:#8e8e8e">
                          Thinking...
                     </div>`;

                chatBox.appendChild(loadRow);

                chatBox.scrollTop =
                    chatBox.scrollHeight;

                /*
                 * IMPORTANT:
                 * Frontend is now hosted separately on Vercel.
                 * Backend is hosted on Render.
                 */

                const res = await fetch(
                    'https://evoluteiq-ai-mcp-chatbot.onrender.com/api/chat',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json',
                            'X-API-KEY': key
                        },

                        body: JSON.stringify({

                            message: text,

                            history: chatHistory,

                            temperature: temp,

                            image: base64,

                            imageType: imgType,

                            useRAG: useRag,

                            useMCP: useMCP,

                            filterCategory: filterCategory,

                            filterRole: 'all',

                            filterRule: 'must'
                        })
                    }
                );

                const data =
                    await res.json();

                const loader =
                    document.getElementById(
                        'loading'
                    );

                if (loader) {
                    loader.remove();
                }

                if (!res.ok) {

                    addMessage(
                        'bot',
                        "Error: " +
                        (
                            data.error ||
                            "Request failed"
                        )
                    );

                    chatHistory.pop();

                } else {

                    const botBody =
                        addMessage(
                            'bot',
                            data.response
                        );

                    chatHistory.push({
                        role: 'model',
                        text: data.response
                    });

                    if (
                        data.agent_trace &&
                        data.agent_trace.length > 0
                    ) {

                        renderTrace(
                            data.agent_trace,
                            botBody
                        );
                    }

                    if (
                        data.sentiment &&
                        userBody
                    ) {

                        const sMap = {
                            positive: ' 😊',
                            negative: ' 😢'
                        };

                        if (sMap[data.sentiment]) {

                            const badge =
                                document.createElement(
                                    'span'
                                );

                            badge.textContent =
                                sMap[data.sentiment];

                            badge.style.fontSize =
                                '12px';

                            userBody.appendChild(
                                badge
                            );
                        }
                    }
                }

            } catch (err) {

                const loader =
                    document.getElementById(
                        'loading'
                    );

                if (loader) {
                    loader.remove();
                }

                addMessage(
                    'bot',
                    "Error: " + err.message
                );

                chatHistory.pop();
            }
        }

        sendBtn.onclick =
            sendMessage;

        userInput.onkeydown =
            function (e) {

                if (e.key === 'Enter') {
                    sendMessage();
                }
            };

    </script>

</body>
</html>
